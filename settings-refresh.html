<div class="box"><div class="pulse"></div><h1>Refreshing ACL Settings</h1><p>Clearing the old app cache and loading the latest Expert Edition settings…</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/Cardiology/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('ACL cache reset',e)}
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/Cardiology/service-worker.js?v=6.0.0',{scope:'/Cardiology/',updateViaCache:'none'});
      await reg.update().catch(()=>{});
    }
  }catch(e){console.warn('ACL worker reinstall',e)}
  const url=new URL('settings.html',location.href);
  url.searchParams.set('edition','expert');
  url.searchParams.set('acl_refresh',Date.now().toString());
  location.replace(url.toString());
})();
</script>
