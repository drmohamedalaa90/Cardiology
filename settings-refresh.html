<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061c3d">
<title>Refreshing ACL Settings…</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f8fc;color:#153250}body{display:grid;place-items:center;padding:24px}.box{width:min(460px,100%);padding:28px;border:1px solid #d8e6f4;border-radius:20px;background:#fff;box-shadow:0 16px 40px rgba(9,48,93,.09);text-align:center}.pulse{width:46px;height:46px;margin:0 auto 16px;border:4px solid #d8e8f8;border-top-color:#0f5fbf;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}h1{margin:0 0 8px;font-size:22px}p{margin:0;color:#6b7f94;font-size:14px;line-height:1.5}</style>
</head>
<body>
<div class="box"><div class="pulse"></div><h1>Refreshing ACL Settings</h1><p>Clearing the old app cache and loading the latest Expert Edition settings…</p></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/Cardiology/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){console.warn('ACL cache reset',e)}
  try{
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('/Cardiology/service-worker.js?v=6.0.0',{scope:'/Cardiology/',updateViaCache:'none'});
      await reg.update().catch(()=>{});
    }
  }catch(e){console.warn('ACL worker reinstall',e)}
  const url=new URL('settings.html',location.href);
  url.searchParams.set('edition','expert');
  url.searchParams.set('acl_refresh',Date.now().toString());
  location.replace(url.toString());
})();
</script>
</body>
</html>
