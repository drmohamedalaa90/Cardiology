<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Learning Mode | ACL Expert Edition
  </title>

  <!-- Main ACL stylesheet -->
  <link
    rel="stylesheet"
    href="assets/css/main.css?v=2.7.11"
  >

  <!-- Learning feedback, Dr. Corazón and flashcard styles -->
  <link
    rel="stylesheet"
    href="assets/css/learning-feedback.css?v=3.9.0"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

  <!-- =====================================================
       FIXED TOP HEADER
  ====================================================== -->

  <header class="topbar">

    <a
      class="brand brand-link"
      href="modules.html"
      aria-label="Return to ACL modules"
    >
      Alexandria Cardiology League;
      <b>THE EXPERT EDITION</b>
    </a>


    <nav aria-label="Main navigation">

      <a
        id="userChip"
        class="user-chip"
        href="profile.html"
        aria-label="Open my profile"
      ></a>

      <a
        class="nav-btn"
        href="modules.html"
      >
        Modules
      </a>

      <a
        class="nav-btn"
        href="progress.html"
      >
        My Progress
      </a>

      <button
        class="nav-btn"
        type="button"
        onclick="aclSignOut()"
      >
        Sign Out
      </button>

    </nav>

  </header>


  <!-- =====================================================
       LEARNING MODE
  ====================================================== -->

  <main class="container learning-shell">

    <section class="learning-hero">

      <span class="admin-kicker">
        Learning Mode
      </span>

      <h1 id="moduleTitle">
        Loading module…
      </h1>

      <h2 id="quizTitle"></h2>

      <p
        id="quizDescription"
        class="muted"
      ></p>

    </section>


    <section class="card learning-card">

      <!-- Quiz status -->

      <div class="quiz-status">

        <span
          id="questionCount"
          class="question-count"
        ></span>

        <span
          id="saveStatus"
          class="save-pill"
          aria-live="polite"
        >
          Preparing…
        </span>

      </div>


      <!-- Progress bar -->

      <div
        class="learning-progress"
        aria-label="Quiz progress"
      >
        <span id="progressFill"></span>
      </div>


      <!-- Question and options are rendered here -->

      <div
        id="quizArea"
        aria-live="polite"
      >
        <p>
          Loading your quiz…
        </p>
      </div>


      <!--
        Dr. Corazón correct/incorrect feedback will be
        rendered here after the candidate checks an answer.
      -->

      <div
        id="answerFeedbackHost"
        aria-live="polite"
      ></div>


      <!-- Learning actions -->

      <div class="learning-actions">

        <button
          id="submitAnswer"
          class="primary-btn"
          type="button"
        >
          Check answer
        </button>

        <button
          id="nextQuestion"
          class="primary-btn"
          type="button"
          hidden
        >
          Next question
        </button>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FLASHCARD MODAL
  ====================================================== -->

  <div
    id="learningFlashcardModal"
    class="learning-flashcard-modal"
    hidden
  >

    <!-- Clicking the backdrop closes the modal -->

    <button
      id="learningFlashcardBackdrop"
      class="learning-flashcard-backdrop"
      type="button"
      aria-label="Close flashcard"
    ></button>


    <section
      class="learning-flashcard-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="learningFlashcardTitle"
    >

      <div class="learning-flashcard-head">

        <div>

          <span
            id="learningFlashcardType"
            class="learning-flashcard-type"
          >
            FLASHCARD
          </span>

          <h2 id="learningFlashcardTitle">
            Topic review
          </h2>

        </div>


        <button
          id="closeLearningFlashcard"
          class="learning-flashcard-close"
          type="button"
          aria-label="Close flashcard"
        >
          ×
        </button>

      </div>


      <!-- Flashcard headings and bullet points -->

      <div
        id="learningFlashcardContent"
        class="learning-flashcard-content"
      ></div>


      <button
        id="closeLearningFlashcardBottom"
        class="primary-btn learning-flashcard-return"
        type="button"
      >
        Return to the question
      </button>

    </section>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="assets/js/learning-mode.js?v=3.9.0"
  ></script>

</body>

</html>
