<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Engine | ACL Admin</title><link rel="stylesheet" href="assets/css/main.css?v=2.6"><link rel="stylesheet" href="assets/css/auth.css?v=1.5.1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><a class="brand brand-link" href="modules.html">Alexandria Cardiology League; <b>THE EXPERT EDITION</b></a><nav><a id="userChip" class="user-chip" href="profile.html"></a><a class="nav-btn" href="admin.html">Admin</a><button class="nav-btn" onclick="aclSignOut()">Sign Out</button></nav></header>
<main class="container"><section class="card admin-hero"><div><span class="admin-kicker">PHASE 2.6</span><h1>Adaptive Access Engine</h1><p class="muted">Create prerequisite, score, academic-position, or manual-assignment rules.</p></div></section><div id="accessStatus" class="status-box"></div>
<section class="card"><h2>Add unlock rule</h2><form id="ruleForm" class="form-grid"><div class="field"><label>Module</label><select id="moduleId" required></select></div><div class="field"><label>Rule type</label><select id="ruleType"><option value="prerequisite_module">Prerequisite module</option><option value="minimum_total_score">Minimum total score</option><option value="academic_position">Academic position</option><option value="manual_assignment">Manual assignment</option></select></div><div class="field"><label>Prerequisite module</label><select id="prerequisiteId"><option value="">None</option></select></div><div class="field"><label>Minimum score</label><input id="minimumValue" type="number" min="0" value="0"></div><div class="field"><label>Allowed positions (comma-separated)</label><input id="allowedPositions" placeholder="Resident, Intern, Medical Student"></div><button class="primary-btn" type="submit">Save rule</button></form></section>
<section class="card"><h2>Current rules</h2><div class="table-wrap"><table class="admin-table"><thead><tr><th>Module</th><th>Rule</th><th>Requirement</th><th>Action</th></tr></thead><tbody id="rulesBody"></tbody></table></div></section></main>
<script type="module" src="assets/js/admin-access.js?v=2.6"></script><script type="module" src="assets/js/session-ui.js?v=2.6"></script></body></html>
