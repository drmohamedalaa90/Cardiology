<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#072b49">
<title>My profile | Cardiology League</title>
<link rel="stylesheet" href="assets/css/basic-universal-shell.css?v=20261023-simple">
<link rel="stylesheet" href="assets/css/basic-pages.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.basic-profile-page{max-width:1180px;margin:34px auto 110px}
.basic-profile-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 26px;padding:0 2px}
.basic-profile-heading h1{margin:0;color:#102f49;font-size:clamp(1.6rem,3vw,2rem);font-weight:750;letter-spacing:-.035em}
.basic-profile-heading>a{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 17px;border:1px solid #cddde7;border-radius:10px;background:#fff;color:#163f59;font-size:13px;font-weight:650;text-decoration:none}
.basic-profile-heading>a:hover{background:#edf5f9;border-color:#9fbccb}
.basic-profile-heading svg{width:16px;height:16px}
.basic-profile-page .basic-profile-grid{grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.basic-profile-page .basic-card{border:1px solid #dce6ed;border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(16,47,73,.035)}
.basic-profile-page .basic-profile-card{padding:30px 24px 22px;overflow:hidden}
.basic-profile-page .basic-profile-photo{width:108px;height:108px;margin:0 auto 17px;border:4px solid #f1f6f9;border-radius:50%;background:#eaf2f6;color:#185a77;font-size:26px;box-shadow:0 0 0 1px #dce6ed}
.basic-profile-page .basic-profile-photo img{width:100%;height:100%;object-fit:cover}
.basic-profile-page .basic-profile-card h2{margin:0;font-size:21px;line-height:1.3;letter-spacing:-.025em;color:#123852}
.basic-profile-page .handle{margin-top:6px;color:#718696;font-size:13px;font-weight:500}
.basic-profile-page .basic-profile-details{display:grid;grid-template-columns:1fr;gap:0;margin-top:25px;text-align:left;border-top:1px solid #edf1f5}
.basic-profile-page .basic-detail{display:block;padding:15px 0;border-bottom:1px solid #edf1f5;border-radius:0;background:transparent}
.basic-profile-page .basic-detail span{display:block;margin-bottom:5px;color:#8193a0;font-size:10px;font-weight:650;letter-spacing:.07em;text-transform:uppercase}
.basic-profile-page .basic-detail strong{display:block;color:#28495e;font-size:13px;font-weight:550;line-height:1.5;overflow-wrap:anywhere}
.basic-profile-friend-stat{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:19px;color:#7b8f9e;font-size:12px}
.basic-profile-friend-stat strong{font-size:15px;color:#1b526e}
.basic-profile-page .basic-profile-friends{padding:25px;margin-top:0;min-width:0}
.basic-profile-friends-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}
.basic-profile-friends-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;color:#153c56}
.basic-profile-friends-head>svg{width:22px;height:22px;color:#7e9aaa}
.basic-profile-page .basic-friends-toolbar{position:relative;display:block;width:100%;margin-bottom:20px}
.basic-friends-toolbar>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#7e94a3;pointer-events:none}
.basic-profile-page .basic-search{display:block;width:100%;max-width:none;box-sizing:border-box;height:46px;min-width:0;padding:0 14px 0 43px;border:1px solid #dde7ed;border-radius:11px;background:#f8fafc;font-size:13px;color:#173e58}
.basic-profile-page .basic-search:focus{outline:2px solid #72b5cd;outline-offset:2px;background:#fff}
.basic-profile-page .basic-friend-list{gap:10px}
.basic-profile-page .basic-friend-row{padding:13px 0;border:0;border-bottom:1px solid #edf2f5;border-radius:0}
.basic-profile-page .basic-friend-copy strong{font-size:14px}
.basic-profile-page .basic-friend-copy small{font-size:11px;color:#8194a1}
.basic-profile-page .basic-person-avatar{border-radius:50%;background:#edf4f8;color:#1a5c7b}
.basic-profile-page .basic-friend-actions button,.basic-profile-page .basic-friend-actions a{min-height:35px;padding:0 12px;border-radius:9px;font-size:11px}
.basic-profile-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:195px;padding:22px;text-align:center}
.basic-profile-empty>svg{width:38px;height:38px;padding:14px;box-sizing:content-box;border-radius:50%;background:#f0f6f9;color:#7694a5}
.basic-profile-empty strong{font-size:14px;font-weight:550;color:#6e8594}
.basic-profile-empty button{padding:8px 12px;background:none;border:0;color:#14728e;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.basic-profile-empty button:hover{text-decoration:underline}
.basic-profile-requests-title{margin:0 0 4px;color:#7d909e;font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.basic-profile-page .basic-search-results:not([hidden]){margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #e8eff3}
.basic-profile-page #basicFriendRequests:not(:empty){margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #e8eff3}
.basic-profile-page .basic-empty-state{border:0;background:transparent;font-size:13px;color:#7c919e}
@media(max-width:820px){.basic-profile-page{margin-top:22px}.basic-profile-page .basic-profile-grid{grid-template-columns:1fr}.basic-profile-page .basic-profile-card{padding:25px}.basic-profile-page .basic-profile-details{grid-template-columns:1fr 1fr;column-gap:22px}.basic-profile-page .basic-profile-friends{padding:22px}.basic-profile-heading{margin-bottom:20px}}
@media(max-width:480px){.basic-profile-page{width:calc(100% - 24px)}.basic-profile-page .basic-profile-details{grid-template-columns:1fr}.basic-profile-heading>a{padding:0 12px;font-size:12px}.basic-profile-page .basic-profile-card,.basic-profile-page .basic-profile-friends{padding:22px 18px}.basic-profile-page .basic-friend-actions{flex-wrap:wrap}}
</style>
<link rel="stylesheet" href="assets/css/basic-navigation.css?v=1"></head>
<body><script src="assets/js/basic-navigation.js?v=1"></script>
<main class="basic-page basic-profile-page">
<header class="basic-profile-heading"><h1>My profile</h1><a href="settings.html?edition=basic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m14 5 5 5"/></svg>Edit profile</a></header>
<div class="basic-profile-grid">
<aside class="basic-card basic-profile-card" aria-label="Profile details">
<div id="basicProfilePhoto" class="basic-profile-photo">ACL</div>
<h2 id="basicProfileName">Loading…</h2>
<div id="basicProfileHandle" class="handle">@member</div>
<div class="basic-profile-details">
<div class="basic-detail"><span>Email</span><strong id="basicProfileEmail">—</strong></div>
<div class="basic-detail"><span>Role / Year</span><strong id="basicProfileYear">—</strong></div>
<div class="basic-detail"><span>Institution</span><strong id="basicProfileInstitution">—</strong></div>
</div>
<div class="basic-profile-friend-stat"><strong id="basicFriendCount">0</strong><span>Friends</span></div>
</aside>
<section class="basic-card basic-profile-friends" aria-labelledby="basicProfileFriendsTitle">
<header class="basic-profile-friends-head"><h2 id="basicProfileFriendsTitle">Friends</h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></svg></header>
<div class="basic-friends-toolbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="basicFriendSearch" class="basic-search" type="search" aria-label="Find friends by name or username" placeholder="Find friends by name or username" autocomplete="off"></div>
<div id="basicFriendRequests" class="basic-friend-list"></div>
<div id="basicFriendSearchResults" class="basic-search-results" aria-live="polite" hidden></div>
<div id="basicFriendsList" class="basic-friend-list" aria-live="polite"><div class="basic-empty-state">Loading…</div></div>
</section>
</div>
</main>
<script type="module" src="assets/js/basic-profile.js?v=4"></script>
<script type="module" src="assets/js/basic-universal-shell.js?v=20261024-fixed-nav"></script>
</body></html>
