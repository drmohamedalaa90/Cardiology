<label class="form-field">
  <span>Answer feedback</span>
  <select id="feedbackMode">
    <option value="immediate">Immediate — show answer and explanation after each question</option>
    <option value="after_submission">After submission — reveal answers only after the quiz</option>
    <option value="none">None — do not reveal answers</option>
  </select>
</label>
<label class="checkbox-field"><input id="showFlashcards" type="checkbox" checked><span>Show “Review the flashcard” after answer review</span></label>
<label class="checkbox-field"><input id="showFinalReview" type="checkbox" checked><span>Show question-by-question review after submission</span></label>
<label class="checkbox-field"><input id="requireReviewBeforeNext" type="checkbox" checked><span>Require Continue after reviewing feedback</span></label>
