<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition Manager | ACL</title><link rel="stylesheet" href="assets/css/main.css?v=2.8.7"><link rel="stylesheet" href="assets/css/auth.css?v=1.5.1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><a class="brand brand-link" href="modules.html">Alexandria Cardiology League; <b>THE EXPERT EDITION</b></a><nav><a id="userChip" class="user-chip" href="profile.html"></a><a class="nav-btn" href="admin.html">Admin</a><a class="nav-btn" href="modules.html">Modules</a><button class="nav-btn" onclick="aclSignOut()">Sign Out</button></nav></header>
<main class="container">
<section data-admin-shell data-active="competitions"></section><section class="card admin-hero"><div><span class="admin-kicker">PHASE 2.5</span><h1>Competition Manager</h1><p class="muted">Schedule official ACL rounds, define duration and anti-cheat rules, then publish them.</p></div><button id="newCompetition" class="primary-btn">Create Competition</button></section><div id="status" class="status-box" hidden></div><section id="competitionList" class="module-admin-grid"></section></main>
<dialog id="competitionDialog" class="module-dialog"><form id="competitionForm"><div class="dialog-title-row"><h2 id="dialogTitle">Create Competition</h2><button type="button" id="closeDialog" class="dialog-close">×</button></div><input id="competitionId" type="hidden"><div class="module-form-grid"><label>Module<select id="moduleId" required></select></label><label>Quiz<select id="quizId" required></select></label><label>Title<input id="title" required></label><label>Slug<input id="slug" required></label><label>Opens at<input id="opensAt" type="datetime-local" required></label><label>Closes at<input id="closesAt" type="datetime-local" required></label><label>Duration (minutes)<input id="duration" type="number" min="1" value="20"></label><label>Warnings allowed<input id="warnings" type="number" min="0" max="10" value="2"></label><label>Status<select id="competitionStatus"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label class="full-span">Description<textarea id="description" rows="3"></textarea></label></div><div class="toggle-grid"><label><input id="confidence" type="checkbox" checked> Confidence scoring</label><label><input id="randomQuestions" type="checkbox" checked> Randomize questions</label><label><input id="randomOptions" type="checkbox" checked> Randomize options</label><label><input id="leaderboard" type="checkbox" checked> Show leaderboard</label><label><input id="antiCheat" type="checkbox" checked> Anti-cheat</label></div><div class="form-actions"><button type="button" id="cancel" class="secondary-btn">Cancel</button><button class="primary-btn">Save Competition</button></div></form></dialog>
<script type="module" src="assets/js/admin-competitions.js?v=2.8.0"></script><script type="module" src="assets/js/session-ui.js?v=2.7.12"></script><script type="module" src="assets/js/admin-shell.js?v=2.8.0"></script></body></html>
