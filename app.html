  <script>
  (function(){
    try{
      var parts=new Intl.DateTimeFormat('en-US',{timeZone:'Africa/Cairo',weekday:'short'}).formatToParts(new Date());
      var weekday=(parts.find(function(x){return x.type==='weekday';})||{}).value;
      if(weekday==='Fri'){document.documentElement.classList.add('clinic-v59-friday-boot');}
    }catch(e){}
  })();
  </script>
  <style>
    html.clinic-v59-friday-boot #mainContent,
    html.clinic-v59-friday-boot .main-content{visibility:hidden !important;}
  </style>
