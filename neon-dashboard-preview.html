<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACL · Neon Migration Preview</title><style>body{font:16px system-ui;background:#f6f7fb;color:#172033;margin:0;padding:32px}main{max-width:760px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #16203a15}h1{color:#b91c1c}a{color:#b91c1c}#status{font-weight:600}</style></head><body><main><h1>ACL · Neon Dashboard Preview</h1><p id="status">Checking Google session…</p><p id="account"></p><p>This is an authentication-only preview. Administrator permissions and student records will appear only after secure server-side authorization is connected.</p><p><a href="./neon-google-login-test.html">Return to sign-in</a></p></main><script type="module">import {createAuthClient} from "https://esm.sh/@neondatabase/auth";const auth=createAuthClient("https://ep-mute-sky-zantnre1.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth");try{const r=await auth.getSession();if(r.data?.user){document.querySelector("#status").textContent="✓ Google session verified";document.querySelector("#account").textContent="Signed in as "+r.data.user.email;try{const t=await auth.token();const jwt=t?.data?.token;if(!jwt)throw Error("No session JWT available");const response=await fetch("https://acl-neon-api.drmohamedalaa90.workers.dev/auth/me",{headers:{Authorization:"Bearer "+jwt}});const profile=await response.json();if(!response.ok)throw Error("API authorization failed ("+response.status+")");if(profile.linked&&profile.profile){document.querySelector("#status").textContent="✓ Neon account linked and verified";document.querySelector("#account").textContent="Name: "+profile.profile.full_name+" | Role: "+profile.profile.role+" | Google: "+r.data.user.email;}else{document.querySelector("#account").textContent="Authenticated, but ACL profile is not linked.";}}catch(err){document.querySelector("#account").textContent="Google signed in; ACL API verification pending: "+err.message;}}else{document.querySelector("#status").textContent="Not signed in — please return to sign-in.";}}catch(e){document.querySelector("#status").textContent="Session check failed. Please try again.";}</script></body></html>
