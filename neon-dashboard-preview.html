<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACL · Neon Migration Preview</title><style>body{font:16px system-ui;background:#f6f7fb;color:#172033;margin:0;padding:32px}main{max-width:1050px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #16203a15}h1{color:#b91c1c}a{color:#b91c1c}#status{font-weight:600}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}#students{overflow-x:auto}input{padding:10px;width:min(95%,380px);border:1px solid #ccc;border-radius:8px}</style></head><body><main><h1>ACL · Neon Dashboard Preview</h1><p id="status">Checking Google session…</p><p id="account"></p><section id="directory" hidden><h2>Student directory <span id="count"></span></h2><p>Read-only Neon test data. Only verified ACL administrators can access this directory.</p><input id="filter" placeholder="Search students by name"><div id="students"></div></section><p id="note">This is a test dashboard; other ACL modules are not yet migrated.</p><p><a href="./neon-google-login-test.html">Return to sign-in</a></p></main><script type="module">import {createAuthClient} from "https://esm.sh/@neondatabase/auth";const auth=createAuthClient("https://ep-mute-sky-zantnre1.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth",{fetchOptions:{credentials:"include"}});try{const r=await auth.getSession();if(r.data?.user){document.querySelector("#status").textContent="✓ Google session verified";document.querySelector("#account").textContent="Signed in as "+r.data.user.email;try{const tokenResult=await auth.token();if(tokenResult.error)throw Error("JWT request: "+tokenResult.error.message);const jwt=tokenResult.data?.token;if(!jwt)throw Error("Neon returned no JWT");let response;try{response=await fetch("https://acl-neon-api.drmohamedalaa90.workers.dev/auth/me",{headers:{Authorization:"Bearer "+jwt}});}catch(e){throw Error("ACL API network: "+e.message)}const profile=await response.json();if(!response.ok)throw Error("ACL API HTTP "+response.status+" ("+(profile.error||profile.reason||"unknown")+")");if(profile.linked&&profile.profile){document.querySelector("#status").textContent="✓ Neon account linked and verified";document.querySelector("#account").textContent="Name: "+profile.profile.full_name+" | Role: "+profile.profile.role+" | Google: "+r.data.user.email;if(profile.profile.role==="admin"){const sr=await fetch("https://acl-neon-api.drmohamedalaa90.workers.dev/admin/students",{headers:{Authorization:"Bearer "+jwt}});if(!sr.ok)throw Error("Student directory HTTP "+sr.status);const data=await sr.json();const rows=data.students||[];document.querySelector("#directory").hidden=false;document.querySelector("#count").textContent="("+rows.length+")";const root=document.querySelector("#students");function render(){const q=document.querySelector("#filter").value.toLowerCase();const table=document.createElement("table");const head=document.createElement("tr");for(const name of ["Name","Academic year","Role","XP","Status"]){const th=document.createElement("th");th.textContent=name;head.append(th)}table.append(head);for(const student of rows.filter(x=>(x.full_name||"").toLowerCase().includes(q))){const tr=document.createElement("tr");for(const value of [student.full_name,student.academic_year,student.role,student.xp,student.account_status]){const td=document.createElement("td");td.textContent=value??"—";tr.append(td)}table.append(tr)}root.replaceChildren(table)}document.querySelector("#filter").addEventListener("input",render);render();}}else{document.querySelector("#account").textContent="Authenticated, but ACL profile is not linked.";}}catch(err){document.querySelector("#account").textContent="Google signed in; ACL API verification pending: "+err.message;}}else{document.querySelector("#status").textContent="Not signed in — please return to sign-in.";}}catch(e){document.querySelector("#status").textContent="Session check failed. Please try again.";}</script></body></html>
