<body><header class="topbar"><a class="brand brand-link" href="modules.html" aria-label="ACL Expert Edition home">Alexandria Cardiology League; <b>THE EXPERT EDITION</b></a></header>
<main class="auth-shell"><section class="auth-card"><h1>Choose a new password</h1><p class="muted">Open this page through the recovery link sent to your email.</p>
