<body><header class="topbar"><div class="brand">ACL; <b>THE EXPERT EDITION</b></div></header>
<main class="auth-shell"><section class="auth-card"><h1>Choose a new password</h1><p class="muted">Open this page through the recovery link sent to your email.</p>
<form id="resetForm"><div class="form-grid"><div class="field full"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field full"><label for="newPasswordConfirm">Confirm new password</label><input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required></div></div><button class="primary-btn" type="submit" style="margin-top:18px">Save new password</button><div id="resetError" class="message error"></div><div id="resetSuccess" class="message success"></div></form></section></main>
