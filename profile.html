<!doctype html><html lang="en"><head>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | ACL</title>
<link rel="stylesheet" href="assets/css/main.css?v=2.7.5"><link rel="stylesheet" href="assets/css/auth.css?v=1.5.1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class="topbar"><a class="brand brand-link" href="modules.html" aria-label="ACL Expert Edition home">Alexandria Cardiology League; <b>THE EXPERT EDITION</b></a><nav><a id="userChip" class="user-chip" href="profile.html"></a><a class="nav-btn" href="modules.html">Modules</a><a class="nav-btn" href="progress.html">My Progress</a><button class="nav-btn" onclick="aclSignOut()">Sign Out</button></nav></header>
<main class="container">
<section class="card"><h1>My Profile</h1><div class="profile-layout"><aside class="profile-avatar-card"><img id="avatarPreview" class="profile-avatar-large" alt="" style="display:none"><div id="avatarPlaceholder" class="avatar-placeholder" style="width:150px;height:150px;margin:auto;font-size:2rem">ACL</div><p><input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></p></aside>
<form id="profileForm"><div class="form-grid"><div class="field full"><label>Name</label><input id="name" class="readonly-field" readonly></div><div class="field full"><label>Email</label><input id="email" class="readonly-field" readonly></div><div class="field full"><label>Username</label><input id="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._]+" required><small>Letters, numbers, dots and underscores only.</small></div><div class="field full"><label>WhatsApp</label><input id="whatsapp" required></div><div class="field"><label for="academicYear">Position</label><select id="academicYear" required><option value="" disabled selected>Select position</option><option value="Consultant">Consultant</option><option value="Specialist">Specialist</option><option value="Assistant Lecturer">Assistant Lecturer</option><option value="Resident">Resident</option><option value="General Practitioner">General Practitioner</option><option value="Intern">Intern</option><option value="Medical Student">Medical Student</option><option value="Nurse">Nurse</option><option value="Technician">Technician</option></select></div><div class="field"><label>Institution</label><input id="institution" required></div></div><button class="primary-btn" type="submit" style="margin-top:18px">Save profile</button><div id="profileStatus" class="status-box"></div></form></div></section>
<section class="card" style="margin-top:20px"><h2>Change password</h2><form id="passwordForm"><div class="form-grid"><div class="field full"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="profileNewPassword">New password</label><input id="profileNewPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="profileConfirmPassword">Confirm new password</label><input id="profileConfirmPassword" type="password" autocomplete="new-password" minlength="8" required></div></div><button class="primary-btn" type="submit" style="margin-top:18px">Change password</button><div id="passwordStatus" class="status-box"></div></form></section>
</main><script type="module" src="assets/js/profile-page.js?v=1.5.1"></script><script type="module" src="assets/js/session-ui.js?v=2.7.5"></script></body></html>
