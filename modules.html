<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Modules | ACL Expert Edition
  </title>

  <link
    rel="stylesheet"
    href="assets/css/main.css?v=2.8.5"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

  <!-- =====================================================
       HEADER

       session-ui.js transforms this fallback header into the
       unified rolling ACL header with centered icon navigation.
  ====================================================== -->

  <header class="topbar">

    <a
      class="brand brand-link"
      href="modules.html"
      aria-label="ACL Expert Edition home"
    >
      Alexandria Cardiology League;
      <b>THE EXPERT EDITION</b>
    </a>


    <nav aria-label="Main navigation">

      <a
        id="userChip"
        class="user-chip"
        href="profile.html"
        aria-label="Open my profile"
      ></a>


      <a
        class="nav-btn"
        href="modules.html"
        aria-current="page"
      >
        Modules
      </a>


      <a
        class="nav-btn"
        href="progress.html"
      >
        My Progress
      </a>


      <button
        class="nav-btn"
        type="button"
        onclick="aclSignOut()"
      >
        Sign Out
      </button>

    </nav>

  </header>


  <!-- =====================================================
       MODULE CATALOGUE
  ====================================================== -->

  <main class="container modules-page">

    <section class="catalogue-hero">

      <div>

        <span class="admin-kicker">
          ACL Learning Catalogue
        </span>

        <h1>
          Choose your next challenge
        </h1>

      </div>


      <div
        id="catalogueSummary"
        class="catalogue-summary"
        aria-live="polite"
      >
        Loading catalogue…
      </div>

    </section>


    <!-- Status messages -->

    <div
      id="modulesStatus"
      class="status-box"
      role="status"
      aria-live="polite"
      hidden
    ></div>


    <!-- Modules rendered from Supabase -->

    <section
      id="modulesGrid"
      class="module-catalogue-grid"
      aria-label="Available ACL modules"
      aria-live="polite"
    >

      <div class="empty-state">
        Loading modules…
      </div>

    </section>


    <!-- Official competitions -->

    <section class="card competitions-card">

      <div>

        <span class="admin-kicker">
          ACL Competitions
        </span>

        <h2>
          Official ACL Competitions
        </h2>

        <p class="muted">
          Enter upcoming and live Alexandria Cardiology League rounds.
        </p>

      </div>


      <a
        class="primary-btn"
        href="competitions.html"
      >
        Open Competitions
      </a>

    </section>

  </main>


  <!-- =====================================================
       JAVASCRIPT

       modules.js imports session-ui.js internally.
       Do not add a separate session-ui.js script here.
  ====================================================== -->

  <script
    type="module"
    src="assets/js/modules.js?v=2.8.1"
  ></script>

</body>

</html>
