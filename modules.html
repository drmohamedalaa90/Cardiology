<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071f3f">
  <title>Modules | Alexandria Cardiology League</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/images/acl-icon-192.png">
  <link rel="stylesheet" href="assets/css/main.css?v=5.1.0">
  <link rel="stylesheet" href="assets/css/acl-final-shell.css?v=1.0.0">
  <link rel="stylesheet" href="assets/css/modules-final.css?v=1.0.0">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="acl-final-page acl-modules-final">
  <header class="topbar acl-shell-source" aria-hidden="true"></header>

  <main class="acl-final-main">
    <section class="acl-modules-hero">
      <div>
        <span id="moduleEyebrow" class="eyebrow">ACL EXPERT LEARNING</span>
        <h1>Modules</h1>
        <p>Choose a module, continue learning, or challenge a colleague.</p>
      </div>
      <span id="editionChip" class="acl-edition-chip">EXPERT EDITION</span>
    </section>

    <section class="acl-findbar" aria-label="Module search and filters">
      <label class="acl-search">
        <span aria-hidden="true">⌕</span>
        <input id="moduleSearch" type="search" placeholder="Search modules…" autocomplete="off" aria-label="Search modules">
      </label>
      <button id="filterToggle" class="acl-filter-btn" type="button" aria-expanded="false" aria-controls="filterPanel">☷ Filters</button>
      <div id="filterPanel" class="acl-filter-panel" hidden>
        <label><span>Category</span><select id="familyFilter"><option value="all">All categories</option><option value="general">General cardiology</option><option value="ecg">ECG & rhythm</option><option value="echo">Imaging / Echo</option><option value="intervention">Intervention</option></select></label>
        <label><span>Difficulty</span><select id="difficultyFilter"><option value="all">All difficulties</option><option value="foundation">Foundation</option><option value="basic">Basic</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option><option value="expert">Expert</option></select></label>
        <label><span>Availability</span><select id="availabilityFilter"><option value="all">All modules</option><option value="open">Available</option><option value="locked">Locked</option><option value="coming">Coming soon</option></select></label>
        <button id="resetFilters" class="acl-reset" type="button">Reset</button>
      </div>
    </section>

    <section id="continueSection" class="acl-section" hidden>
      <div class="acl-section-head"><div><h2>Continue learning</h2><p>Your most recent activity</p></div></div>
      <div id="continueList" class="acl-continue-list"></div>
    </section>

    <section class="acl-section">
      <div class="acl-section-head"><div><h2>All modules</h2><p>A clean, compact view of your ACL curriculum</p></div><span id="moduleCount" class="acl-count">Loading…</span></div>
      <div id="moduleList" class="acl-module-list" aria-live="polite"><div class="acl-loading">Loading your ACL modules…</div></div>
    </section>
  </main>

  <script type="module" src="assets/js/pwa.js?v=1.9.0"></script>
  <script type="module" src="assets/js/modules-final.js?v=1.0.0"></script>
</body>
</html>
