<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACL · Sign In</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f7f8fc,#eef1f7);color:#172033}
.card{width:min(100%,440px);background:#fff;padding:32px;border-radius:22px;box-shadow:0 18px 55px rgba(23,32,51,.12)}
.brand{color:#b91c1c;font-weight:800;letter-spacing:.08em;margin:0 0 8px}
h1{font-size:30px;line-height:1.15;margin:0 0 8px}
.intro{color:#5b6475;margin:0 0 24px}
label{display:block;font-weight:650;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cfd5df;border-radius:10px;font:inherit;outline:none}
input:focus{border-color:#b91c1c;box-shadow:0 0 0 3px rgba(185,28,28,.12)}
button{width:100%;padding:13px 16px;border-radius:10px;font:inherit;font-weight:750;cursor:pointer}
.primary{margin-top:18px;background:#b91c1c;color:#fff;border:1px solid #b91c1c}
.google{background:#fff;color:#172033;border:1px solid #cfd5df}
button:disabled{cursor:wait;opacity:.65}
.divider{display:flex;align-items:center;gap:12px;color:#788193;font-size:14px;margin:22px 0}
.divider::before,.divider::after{content:"";height:1px;background:#e1e5eb;flex:1}
#status{min-height:22px;margin:18px 0 0;font-weight:650}
#details{white-space:pre-wrap;overflow-wrap:anywhere;color:#a11b1b;font:14px/1.45 inherit;margin:7px 0 0}
.small{font-size:13px;color:#687284;margin:18px 0 0}
a{color:#a31616}
</style>
</head>
<body>
<main class="card">
  <p class="brand">ALEXANDRIA CARDIOLOGY LEAGUE</p>
  <h1>Sign in to ACL</h1>
  <p class="intro">Use your existing ACL username and password, or continue securely with Google.</p>

  <form id="passwordForm">
    <label for="identifier">Username or email</label>
    <input id="identifier" name="identifier" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="emailLogin" type="submit">Sign in</button>
  </form>

  <div class="divider">or</div>
  <button class="google" id="googleLogin" type="button">Continue with Google</button>

  <p id="status" role="status" aria-live="polite">Checking your session…</p>
  <p id="details"></p>
  <p><a id="continue" hidden rel="noreferrer">Continue to Google manually</a></p>
</main>
<script type="module">
import { createAuthClient } from "https://esm.sh/@neondatabase/auth";
import { supabaseClient } from "./assets/js/supabase-client.js";

const auth = createAuthClient(new URL("/api/neon-auth", window.location.origin).toString(), {
  fetchOptions: { credentials: "include" }
});
const status = document.querySelector("#status");
const details = document.querySelector("#details");
const continueLink = document.querySelector("#continue");
const emailButton = document.querySelector("#emailLogin");
const googleButton = document.querySelector("#googleLogin");
let loginStarted = false;

function setBusy(busy) {
  emailButton.disabled = busy;
  googleButton.disabled = busy;
}
function showError(message) {
  status.textContent = "Sign-in failed";
  details.textContent = message || "Please check your details and try again.";
  setBusy(false);
}
async function openACL() {
  status.textContent = "Signed in — opening ACL…";
  window.location.replace("./edition-select.html");
}

document.querySelector("#passwordForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  loginStarted = true;
  setBusy(true);
  details.textContent = "";
  status.textContent = "Signing in…";
  try {
    const identifier = document.querySelector("#identifier").value.trim();
    const password = document.querySelector("#password").value;
    const { data, error } = await supabaseClient.functions.invoke("username-login", {
      body: { identifier, password }
    });
    if (error || !data?.session?.access_token || !data?.session?.refresh_token) {
      throw new Error("Wrong username/email or password.");
    }
    const { error: sessionError } = await supabaseClient.auth.setSession({
      access_token: data.session.access_token,
      refresh_token: data.session.refresh_token
    });
    if (sessionError) throw new Error("Could not restore your ACL session.");
    await openACL();
  } catch (error) {
    showError(error.message || String(error));
  }
});

googleButton.addEventListener("click", async () => {
  loginStarted = true;
  setBusy(true);
  continueLink.hidden = true;
  status.textContent = "Contacting Google…";
  details.textContent = "";
  try {
    const result = await auth.signIn.social({ provider: "google", callbackURL: location.href });
    if (result.error) throw new Error(result.error.message || "Google login failed");
    if (result.data?.url) {
      status.textContent = "Opening Google sign-in…";
      continueLink.href = result.data.url;
      continueLink.hidden = false;
      window.location.assign(result.data.url);
      return;
    }
    throw new Error("Google did not return a sign-in link");
  } catch (error) {
    showError(error.message || String(error));
  }
});

async function resumeSignedInSession() {
  try {
    const result = await auth.getSession({ fetchOptions: { credentials: "include" } });
    if (result.error) throw new Error(result.error.message);
    if (!result.data?.user) {
      if (!loginStarted) status.textContent = "Choose a sign-in method";
      return;
    }
    const tokenResult = await auth.token();
    if (tokenResult.error || !tokenResult.data?.token) {
      throw new Error(tokenResult.error?.message || "Neon returned no JWT");
    }
    await openACL();
  } catch (error) {
    if (!loginStarted) {
      status.textContent = "Choose a sign-in method";
      details.textContent = "";
    }
  }
}
resumeSignedInSession();
</script>
</body>
</html>
