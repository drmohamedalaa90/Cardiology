<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#072b49">
  <title>Notifications | ACL Basic Edition</title>
  <link rel="stylesheet" href="assets/css/basic-universal-shell.css?v=20261023-simple">
  <link rel="stylesheet" href="assets/css/basic-pages.css?v=6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/css/basic-notifications.css?v=2"><link rel="stylesheet" href="assets/css/basic-navigation.css?v=1"></head>
<body><script src="assets/js/basic-navigation.js?v=1"></script>
  <main class="basic-page bn-page">
    <section class="basic-page-hero">
      <div>
        
        <h1>Notifications</h1>
        
      </div>
      <button id="bnMarkAll" class="basic-secondary-btn" type="button">Mark all as read</button>
    </section>

    <section class="basic-notification-summary">
      <div>
        <span>Unread</span>
        <strong id="bnUnreadCount">0</strong>
      </div>
      <div class="basic-notification-filter" role="group" aria-label="Notification filters">
        <button type="button" class="is-active" data-filter="all">All</button>
        <button type="button" data-filter="updates">Updates</button>
        <button type="button" data-filter="friends">Friend Requests</button>
        <button type="button" data-filter="challenges">Challenges</button><button type="button" data-filter="competition">Competitions</button>
      </div>
    </section>

    <section id="bnList" class="basic-notification-list" aria-live="polite">
      <div class="basic-empty-state">Loading notifications…</div>
    </section>
  </main>

  <script type="module" src="assets/js/basic-notifications.js?v=5"></script>
  <script type="module" src="assets/js/basic-universal-shell.js?v=20261024-fixed-nav"></script>
</body>
</html>
