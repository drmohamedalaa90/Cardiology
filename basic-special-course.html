<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76520e"><title>Special Course | Alexandria Cardiology League</title><link rel="stylesheet" href="assets/css/basic-universal-shell.css?v=20261023-simple"><link rel="stylesheet" href="assets/css/basic-special-course-page.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="scp-shell"><a class="scp-back" href="basic-home.html?edition=basic">← Basic home</a><section id="scpHero" class="scp-hero"><div id="scpCover" class="scp-cover"></div><div class="scp-hero-content"><div id="scpLogo" class="scp-logo">ACL</div><div><span>ACL SPECIAL COURSE</span><h1 id="scpTitle">Loading course…</h1><p id="scpDescription"></p></div></div></section><section class="scp-layout"><div><div id="scpContent" class="scp-content"><div class="scp-empty">Loading course content…</div></div><section id="scpCertificateSection" class="scp-certificate-section" hidden><div class="scp-section-heading"><div><span>COURSE CERTIFICATE</span><h2>Your certificate</h2></div><button id="scpPrintCertificate" type="button">Print / Save PDF</button></div><article id="scpCertificate" class="scp-certificate"><img id="scpCertificateBackground" class="scp-certificate-bg" alt=""><div class="scp-certificate-inner"><img id="scpCertificateLogo" class="scp-certificate-logo" alt=""><small>ALEXANDRIA CARDIOLOGY LEAGUE</small><h2 id="scpCertificateTitle">Certificate of Completion</h2><p id="scpCertificateSubtitle"></p><p class="scp-awarded">This certificate is awarded to</p><h3 id="scpCandidateName"></h3><p><span id="scpCompletionText">has successfully completed</span></p><h4 id="scpCertificateCourse"></h4><div class="scp-signature"><strong id="scpSignatory"></strong><span id="scpSignatoryRole"></span></div></div></article></section></div><aside id="scpAdmin" class="scp-admin" hidden><header><span>ADMIN EDITOR</span><h2>Course content</h2></header><button id="scpNewItem" class="scp-admin-primary" type="button">+ Add course item</button><form id="scpItemForm" class="scp-admin-form" hidden><input id="scpItemId" type="hidden"><label>Section<input id="scpItemSection" required placeholder="e.g. Session 1 · ECG Basics"></label><label>Content type<select id="scpItemType"><option value="lecture">Lecture</option><option value="flashcards">Flashcards</option><option value="quiz_during">Quiz during lectures</option><option value="quiz_final">Final quiz</option></select></label><label>Title<input id="scpItemTitle" required></label><label>Short details<textarea id="scpItemSubtitle" rows="2"></textarea></label><label>Link<input id="scpItemUrl" type="url" required placeholder="https://..."></label><label>Order<input id="scpItemOrder" type="number" min="1" value="1"></label><label class="scp-check"><input id="scpItemActive" type="checkbox" checked> Visible to candidates</label><div class="scp-form-actions"><button type="submit">Save item</button><button id="scpItemCancel" type="button">Cancel</button></div><p id="scpItemStatus"></p></form><hr><header><span>CERTIFICATE EDITOR</span><h2>Certificate</h2></header><form id="scpCertificateForm" class="scp-admin-form"><label class="scp-check"><input id="scpCertificateEnabled" type="checkbox"> Enable certificate</label><label>Certificate title<input id="scpCertTitle"></label><label>Subtitle<input id="scpCertSubtitle"></label><label>Completion text<input id="scpCertCompletion"></label><label>Signatory name<input id="scpCertSignatory"></label><label>Signatory role<input id="scpCertRole"></label><label>Certificate logo<input id="scpCertLogoFile" type="file" accept="image/*"></label><label>Background image<input id="scpCertBackgroundFile" type="file" accept="image/*"></label><button class="scp-admin-primary" type="submit">Save certificate</button><p id="scpCertificateStatus"></p></form></aside></section></main><script type="module" src="assets/js/basic-special-course-page.js?v=1"></script></body></html>
